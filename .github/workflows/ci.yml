name: CI

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Check Python
        run: ruff check backend ml scripts tests

      - name: Check frontend
        run: |
          npm run lint
          npx tsc -b --noEmit
          npm run build

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed catalog
        run: python -m scripts.seed_catalog

      - name: Test backend through Phase 4
        run: >-
          pytest tests/unit tests/integration
          --cov=backend.domain
          --cov=backend.storage
          --cov=backend.recommendation
          --cov=backend.event_ingestion
          --cov=backend.session_state
          --cov=backend.feature_engine
          --cov=backend.observability
          --cov=scripts
          --cov-fail-under=80
          -q

      - name: Test frontend
        run: npx vitest run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test browser event emission
        run: npx playwright test tests/e2e/test_event_emission.spec.ts
