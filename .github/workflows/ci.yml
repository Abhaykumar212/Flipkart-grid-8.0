name: CI

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Check Python
        run: ruff check backend ml

      - name: Check frontend
        run: |
          npm run lint
          npx tsc -b --noEmit

      - name: Test Python
        run: pytest -q

      - name: Test frontend
        run: npx vitest run
