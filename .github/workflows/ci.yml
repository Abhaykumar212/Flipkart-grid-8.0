name: CI

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Check Python
        run: ruff check backend ml scripts tests

      - name: Check frontend
        run: |
          npm run lint
          npx tsc -b --noEmit
          npm run build

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed catalog
        run: python -m scripts.seed_catalog

      - name: Test backend runtime
        run: >-
          pytest tests/unit tests/integration
          --cov=backend.domain
          --cov=backend.storage
          --cov=backend.policy_engine
          --cov=backend.recommendation
          --cov=backend.event_ingestion
          --cov=backend.session_state
          --cov=backend.feature_engine
          --cov=backend.observability
          --cov=scripts
          --cov-fail-under=80
          -q

      - name: Test simulator and training-data contracts
        run: |
          python -m ml.simulator.generate --scale small --seed 42
          pytest tests/model -q

      - name: Train reproducible demo models
        shell: pwsh
        run: ./scripts/train_all.ps1 -Scale full

      - name: Reset and verify deterministic demo scenarios
        shell: pwsh
        run: |
          ./scripts/reset_demo.ps1
          python -m pytest tests/e2e/test_scenarios.py tests/e2e/test_latency.py -q

      - name: Test frontend
        run: npx vitest run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test browser flows
        run: npx playwright test

      - name: Secret scan
        shell: bash
        run: |
          if git grep -nE '(gsk_[A-Za-z0-9]{12,}|sk-ant-[A-Za-z0-9_-]{12,}|sk-[A-Za-z0-9]{20,})' -- backend src scripts .github .env.example; then
            echo 'Potential secret found in runtime source'
            exit 1
          fi
